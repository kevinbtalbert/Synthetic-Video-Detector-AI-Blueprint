name: Synthetic Video Detector
entries:
  - title: Synthetic Video Detector on Cloudera AI
    label: synthetic-video-detector-cai
    short_description: |
      Deploy NVIDIA Synthetic Video Detector on Cloudera AI Workbench with
      bundled NIM GPU application or serverless NVCF API, plus a Next.js Launchpad UI.
    long_description: |
      Requires the custom runtime **SyntheticVideoDetector** v1.4
      (build the repository root Dockerfile with NGC login for nvcr.io, then register).
      Bundled mode embeds the Synthetic Video Detector NIM in a single runtime image.
      Serverless mode uses the NVIDIA Cloud Functions gRPC API (no local GPU required).
      Application subdomains are scoped per project (suffix from project id) so multiple
      deployments can coexist on the same cluster.
    image_path: "https://raw.githubusercontent.com/kevinbtalbert/Synthetic-Video-Detector-AI-Blueprint/refs/heads/main/assets/synthetic-video-detector.jpg"
    tags:
      - Synthetic Video Detection
      - NVIDIA NIM
      - GPU
      - Media Forensics
    git_url: "https://github.com/kevinbtalbert/Synthetic-Video-Detector-AI-Blueprint.git"
    is_prototype: true
    is_community: true
    is_new: true
