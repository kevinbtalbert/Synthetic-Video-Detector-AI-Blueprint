# Single-container Synthetic Video Detector stack (local dev).
# OPEN mode: GPU + local HF model server. SERVERLESS: NVCF (NGC_API_KEY required).

services:
  synthetic-video-detector:
    container_name: synthetic-video-detector
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-synthetic-video-detector:latest}
    runtime: nvidia
    shm_size: 4gb
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
      - "${SVD_OPEN_PORT:-8080}:${SVD_OPEN_PORT:-8080}"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NGC_API_KEY=${NGC_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - NIM_DEPLOY_MODE=${NIM_DEPLOY_MODE:-OPEN}
      - SVD_HF_MODEL_ID=${SVD_HF_MODEL_ID:-dima806/deepfake_vs_real_image_detection}
      - SVD_OPEN_PORT=${SVD_OPEN_PORT:-8080}
      - SVD_NVIDIA_FUNCTION_ID=${SVD_NVIDIA_FUNCTION_ID:-847b6e53-0133-452d-ab85-d7acf3ace723}
      - NVIDIA_SERVERLESS_GRPC_HOST=${NVIDIA_SERVERLESS_GRPC_HOST:-grpc.nvcf.nvidia.com}
      - NVIDIA_SERVERLESS_GRPC_PORT=${NVIDIA_SERVERLESS_GRPC_PORT:-443}
      - APP_PORT=${APP_PORT:-3000}
      - SVD_APP_ROLE=runtime
    volumes:
      - ./volumes/models/huggingface:/home/cdsw/.cache/huggingface
      - ./assets:/opt/synthetic-video-detector/assets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

networks:
  default:
    name: synthetic-video-detector-network
